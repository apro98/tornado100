            <button class="mobile-menu-btn">☰</button>

    <h2 class="section-title">متجر القطع المفردة</h2>

    <div class="filters-container">
        <div class="filters">
            <input type="text" id="shop-search" class="search-input" placeholder="ابحث عن المنتجات...">
            <select id="shop-category" class="filter-select">
                <option value="all">جميع الفئات</option>
                <option value="Panels">ألواح شمسية</option>
                <option value="Batteries">بطاريات</option>
                <option value="Inverters">انفرترات</option>
                <option value="Accessories">ملحقات</option>
            </select>
            <select id="shop-sort" class="filter-select">
                <option value="default">الترتيب الافتراضي</option>
                <option value="price-asc">السعر: من الأقل للأعلى</option>
                <option value="price-desc">السعر: من الأعلى للأقل</option>
            </select>
        </div>
    </div>
    
    <div id="loader" class="loader-container">
        <div class="loader"></div>
    </div>

    <div class="grid-container" id="shop-container">
        <!-- Shop items will be injected here -->
    </div>

    <a href="#" class="floating-whatsapp btn-whatsapp-general">
